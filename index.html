<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST MOVIES</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">GHOST <span>MOVIES</span></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجوی فیلم، توضیحات یا هشتگ...">
                <button id="searchBtn"><i class="bi bi-search"></i></button>
            </div>
        </div>
    </header>

    <section class="hero-banner" id="heroBanner">
        <div class="hero-content">
            <h1 id="heroTitle">به دنیای فیلم‌ خوش آمدید</h1>
            <p id="heroDesc">جدیدترین و محبوب‌ترین فیلم‌ها را با کیفیت بالا به صورت آنلاین تماشا کنید.</p>
        </div>
    </section>

    <main class="container">
        <section class="tags-section">
            <h3 class="section-title"><i class="bi bi-tags-fill"></i> دسته‌بندی موضوعی (هشتگ‌ها)</h3>
            <div class="tags-container-wrapper">
                <div class="tags-slider" id="tagsSlider">
                    <span class="tag-badge active" data-tag="all">🔑 همه فیلم‌ها</span>
                </div>
            </div>
        </section>

        <section class="movie-section">
            <h2 class="section-title">جدیدترین انتشارها</h2>
            <div class="movies-grid" id="latestMoviesGrid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <div class="pagination-container" id="paginationBox">
            </div>
        </section>

        <section class="movie-section">
            <h2 class="section-title">محبوب‌ترین‌ها</h2>
            <div class="movies-grid" id="popularMoviesGrid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>
    </main>

    <a href="vip.html" id="vipFloatingBtn" title="خرید اشتراک VIP">
        <i class="bi bi-gem"></i>
        <span>VIP</span>
    </a>

    <button id="scrollTopBtn" title="بازگشت به بالا">↑</button>

    <script type="module" src="js/app.js"></script>
</body>

</html>
