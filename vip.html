<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST VIP 👑 - بخش ویژه اعضا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cyber-vip-body">

    <header class="main-header vip-header">
        <div class="header-container">
            <button id="menuToggleBtn" class="menu-toggle-btn"><i class="bi bi-list"></i></button>
            <a href="index.html" class="logo vip-logo">GHOST <span>VIP <i class="bi bi-crown-fill"></i></span></a>
            <div class="search-box vip-search-box">
                <input type="text" id="searchInput" placeholder="جستجوی فیلم، توضیحات یا هشتگ...">
                <button id="searchBtn"><i class="bi bi-search"></i></button>
            </div>
        </div>
    </header>

    <section class="hero-banner vip-hero-banner">
        <div class="hero-content vip-hero-content">
            <div class="glitch-wrapper">
                <h1 class="vip-glitch-text" data-text="دسترسی نامحدود به آرشیو VIP">دسترسی نامحدود به آرشیو VIP</h1>
            </div>
            <p>خاص‌ترین و جدیدترین فیلم‌های جهان، بدون سانسور و با بالاترین کیفیت اختصاصی اعضا</p>
            <div class="vip-status-bar">
                <span><i class="bi bi-shield-lock-fill"></i> پروتکل امنیتی سایبر</span>
                <span><i class="bi bi-speedometer2"></i> سرورهای مگا سرعت</span>
            </div>
        </div>
    </section>

    <main class="container">
        <section class="movie-section">
            <h2 class="section-title vip-section-title"><i class="bi bi-lightning-charge-fill"></i> محتوای منحصربه‌فرد
                VIP</h2>
            <div class="movies-grid" id="vipMoviesGrid">
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
            </div>

            <div class="pagination-container" id="paginationBox"></div>
        </section>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header">
            <span class="sidebar-title">منوی دسترسی</span>
            <button id="closeMenuBtn" class="close-menu-btn"><i class="bi bi-x-lg"></i></button>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html"><i class="bi bi-house-door"></i> خانه</a>
            <a href="vip.html"><i class="bi bi-crown"></i> بخش VIP</a>
            <a href="shop.html"><i class="bi bi-bag-check"></i> خرید سرویس</a>
        </nav>

        <div class="sidebar-footer" id="userProfileSection">
            <div class="sidebar-loading">در حال بارگذاری وضعیت کاربری...</div>
        </div>
    </aside>
    
    <button id="scrollTopBtn" class="vip-scroll-btn" title="بازگشت به بالا">↑</button>

    <script type="module">
        import {
            db,
            collection,
            query,
            orderBy,
            onSnapshot
        } from './js/firebase.js';

        const ITEMS_PER_PAGE = 8;
        let currentPage = 1;
        let allVipMovies = [];
        let filteredVipMovies = [];

        document.addEventListener('DOMContentLoaded', () => {
            initVipPage();
        });

        function initVipPage() {
            setupScrollTop();
            fetchVipMoviesLive(); // صدا زدن موتور زنده فایربیس
            setupVipSearch();
        }

        // شنود آنلاین دیتابیس مخصوص پیج VIP
        function fetchVipMoviesLive() {
            const q = query(collection(db, 'movies'), orderBy('createdAt', 'desc'));

            // فعال کردن آپدیت همزمان کلاینت
            onSnapshot(q, (snapshot) => {
                const fetchedMovies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // فیلتر آنی فیلم‌های دارای دسترسی vip
                allVipMovies = fetchedMovies.filter(movie => movie.access === 'vip');

                // اعمال منطق سرچ روی لیست زنده ورودی
                const searchInput = document.getElementById('searchInput');
                const txt = searchInput ? searchInput.value.toLowerCase().trim() : '';

                if (txt === '') {
                    filteredVipMovies = [...allVipMovies];
                } else {
                    filteredVipMovies = allVipMovies.filter(m =>
                        m.title?.toLowerCase().includes(txt) ||
                        m.description?.toLowerCase().includes(txt)
                    );
                }

                // رندر آنی کارت‌ها
                renderVipGrid();
            }, (error) => {
                console.error("خطا در لود زنده فیلم‌های وی‌آی‌پی: ", error);
                const grid = document.getElementById('vipMoviesGrid');
                if (grid) grid.innerHTML = '<p style="color: #ffd700; text-align:center; width:100%;">خطا در برقراری ارتباط زنده با سرور.</p>';
            });
        }

        function renderVipGrid() {
            const grid = document.getElementById('vipMoviesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            if (filteredVipMovies.length === 0) {
                grid.innerHTML = `<p style="color: #a0aec0; grid-column: 1/-1; text-align: center; padding: 40px;">هیچ فیلم ویژه‌ای یافت نشد.</p>`;
                return;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const displayList = filteredVipMovies.slice(startIndex, endIndex);

            displayList.forEach(movie => {
                const card = document.createElement('a');
                card.href = `movie.html?id=${movie.id}`;
                card.className = 'movie-card vip-movie-card';

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <div class="vip-badge-tag"><i class="bi bi-crown-fill"></i> VIP</div>
                        <img data-src="${movie.thumbnail}" alt="${movie.title}" class="lazy-img">
                        <span class="card-duration">${movie.duration}</span>
                    </div>
                    <div class="card-info vip-card-info">
                        <h4 class="card-title">${movie.title}</h4>
                        <div class="card-meta">
                            <span style="color: #ffd700;"><i class="bi bi-eye-fill"></i> ${movie.views || 0} بازدید</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            handleVipLazyLoading();
            renderPagination();
        }

        function handleVipLazyLoading() {
            const lazyImages = document.querySelectorAll('.lazy-img');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.getAttribute('data-src');
                            img.classList.add('loaded');
                            observer.unobserve(img);
                        }
                    });
                });
                lazyImages.forEach(img => observer.observe(img));
            } else {
                lazyImages.forEach(img => { img.src = img.getAttribute('data-src'); img.classList.add('loaded'); });
            }
        }

        function renderPagination() {
            const box = document.getElementById('paginationBox');
            if (!box) return;
            box.innerHTML = '';

            const totalPages = Math.ceil(filteredVipMovies.length / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${currentPage === i ? 'active' : ''}`;
                if (currentPage === i) {
                    btn.style = 'background:#ffd700; color:#000; border-color:#ffd700;';
                }
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderVipGrid();
                    window.scrollTo({ top: 350, behavior: 'smooth' });
                });
                box.appendChild(btn);
            }
        }

        function setupVipSearch() {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchBtn');
            if (!input || !btn) return;

            const search = () => {
                const txt = input.value.toLowerCase().trim();
                currentPage = 1;

                if (txt === '') {
                    filteredVipMovies = [...allVipMovies];
                } else {
                    filteredVipMovies = allVipMovies.filter(m =>
                        m.title?.toLowerCase().includes(txt) ||
                        m.description?.toLowerCase().includes(txt)
                    );
                }
                renderVipGrid();
            };

            btn.addEventListener('click', search);
            input.addEventListener('keyup', (e) => { if (e.key === 'Enter') search(); });
        }

        function setupScrollTop() {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) btn.style.display = 'block';
                else btn.style.display = 'none';
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
    </script>
    <script type="module" src="js/menu.js"></script>
</body>

</html>
