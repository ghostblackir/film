<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST VIP 👑 - بخش ویژه اعضا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-enhancer.css">
</head>

<body class="cyber-vip-body">

    <header class="main-header vip-header">
        <div class="header-container">
            <button id="menuToggleBtn" class="menu-toggle-btn"><i class="bi bi-list"></i></button>
            <a href="index.html" class="logo vip-logo"><i class="bi bi-gem"></i> GHOST <span>VIP <i
                        class="bi bi-crown-fill"></i></span></a>
            <div class="search-box vip-search-box">
                <input type="text" id="searchInput" placeholder="جستجوی فیلم، توضیحات یا هشتگ...">
                <button id="searchBtn"><i class="bi bi-search"></i></button>
            </div>
        </div>
    </header>

    <section class="hero-banner vip-hero-banner"></section>

    <main class="container">
        <section class="movie-section">
            <h2 class="section-title vip-section-title"><i class="bi bi-lightning-charge-fill"></i> محتوای منحصربه‌فرد
                VIP</h2>
            <div class="movies-grid" id="vipMoviesGrid">
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
                <div class="skeleton-card vip-skeleton"></div>
            </div>

            <div class="pagination-container" id="paginationBox"></div>
        </section>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header">
            <span class="sidebar-title">منوی دسترسی</span>
            <button id="closeMenuBtn" class="close-menu-btn"><i class="bi bi-x-lg"></i></button>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html"><i class="bi bi-house-door"></i> خانه</a>
            <a href="vip.html"><i class="bi bi-gem"></i> بخش VIP</a>
            <a href="shop.html"><i class="bi bi-bag-check"></i> خرید سرویس</a>
            <a href="live.html"><i class="bi bi-fire"></i>LIVE</a>
            <a href="series.html"><i class="bi bi-collection-play"></i> سریال‌ها</a>
            <a href="wheel.html" class="active"><i class="bi bi-gear-fill"></i> گردونه شانس</a>
        </nav>

        <div class="sidebar-footer" id="userProfileSection">
            <div class="sidebar-loading">در حال بارگذاری وضعیت کاربری...</div>
        </div>
    </aside>

    <button id="scrollTopBtn" class="vip-scroll-btn" title="بازگشت به بالا">↑</button>

    <script type="module">
        import {
            db,
            auth, // وارد کردن سیستم Auth
            onAuthStateChanged, // متد شنود وضعیت کاربر
            getDoc, // متد گرفتن اطلاعات پروفایل
            doc,
            collection,
            query,
            orderBy,
            onSnapshot
        } from './js/firebase.js';

        const ITEMS_PER_PAGE = 12;
        let currentPage = 1;
        let allVipMovies = [];
        let filteredVipMovies = [];
        let isUserVip = false; // متغیر سراسری سنجش دسترسی

        document.addEventListener('DOMContentLoaded', () => {
            initVipPage();
        });

        function initVipPage() {
            setupScrollTop();
            checkUserVipStatus(); // اول وضعیت اشتراک چک می‌شود، سپس فیلم‌ها لود می‌شوند
            setupVipSearch();
        }

        // بررسی وضعیت واقعی اشتراک کاربر
        // بررسی وضعیت واقعی اشتراک کاربر و کنترل تاریخ انقضا
        function checkUserVipStatus() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const userDocRef = doc(db, 'users', user.uid);
                        const userDoc = await getDoc(userDocRef);

                        if (userDoc.exists()) {
                            const userData = userDoc.data();

                            if (userData.access === 'vip') {
                                const now = new Date();
                                const expireDate = userData.vipExpireAt ? new Date(userData.vipExpireAt) : null;

                                // اگر زمان اشتراک تموم شده بود:
                                if (expireDate && now > expireDate) {
                                    // دیتابیس رو آپدیت کن که دفعات بعد هم رایگان باشه
                                    const { updateDoc } = await import('./js/firebase.js'); // لود متد آپدیت در صورت نیاز
                                    await updateDoc(userDocRef, { access: 'free' });

                                    isUserVip = false;
                                } else {
                                    // اشتراک هنوز زمان داره و معتبره
                                    isUserVip = true;
                                }
                            } else {
                                isUserVip = false;
                            }
                        } else {
                            isUserVip = false;
                        }
                    } catch (error) {
                        console.error("خطا در تایید اشتراک:", error);
                        isUserVip = false;
                    }
                } else {
                    isUserVip = false;
                }

                fetchVipMoviesLive();
            });
        }

        // شنود آنلاین دیتابیس مخصوص پیج VIP
        function fetchVipMoviesLive() {
            const q = query(collection(db, 'movies'), orderBy('createdAt', 'desc'));

            onSnapshot(q, (snapshot) => {
                const fetchedMovies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const now = new Date().getTime();

                // 🌟 اصلاح نهایی و امن: ادغام فیلتر محرمانه آفتاب‌پرست با منطق VIP شما
                allVipMovies = fetchedMovies.filter(movie => {
                    // ۱. بررسی فرکانس مخفی سایت (اگر با حالت فعال شبکه یکی نباشد، فیلم اصلاً وارد پیج نمی‌شود)
                    // فیلم‌های قدیمی بدون mMode به طور خودکار پیش‌فرض ۱ (سیاه) در نظر گرفته می‌شوند
                    const movieMode = movie.mMode || 1;
                    if (movieMode !== activeSystemMode) return false;

                    // ۲. کدهای اصلی و بدون تغییر خودت برای دسترسی VIP:
                    if (movie.access === 'vip') return true;

                    if (movie.access === 'free' && movie.freeUntil) {
                        const targetTime = new Date(movie.freeUntil).getTime();
                        if (targetTime <= now) {
                            return true;
                        }
                    }

                    return false;
                });

                const searchInput = document.getElementById('searchInput');
                const txt = searchInput ? searchInput.value.toLowerCase().trim() : '';

                if (txt === '') {
                    filteredVipMovies = [...allVipMovies];
                } else {
                    filteredVipMovies = allVipMovies.filter(m =>
                        m.title?.toLowerCase().includes(txt) ||
                        m.description?.toLowerCase().includes(txt)
                    );
                }

                renderVipGrid();
            }, (error) => {
                console.error("خطا در لود زنده فیلم‌های وی‌آی‌پی: ", error);
                const grid = document.getElementById('vipMoviesGrid');
                if (grid) grid.innerHTML = '<p style="color: #ffd700; text-align:center; width:100%;">خطا در برقراری ارتباط زنده با سرور.</p>';
            });
        }

        function renderVipGrid() {
            const grid = document.getElementById('vipMoviesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            if (filteredVipMovies.length === 0) {
                grid.innerHTML = `<p style="color: #a0aec0; grid-column: 1/-1; text-align: center; padding: 40px;">هیچ فیلم ویژه‌ای یافت نشد.</p>`;
                return;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const displayList = filteredVipMovies.slice(startIndex, endIndex);

            displayList.forEach(movie => {
                const card = document.createElement('a');

                // ---- دادا اینجا قفل اصلی رو زدم ----
                if (isUserVip) {
                    card.href = `movie.html?id=${movie.id}`; // کاربر VIP میره فیلم رو میبینه
                } else {
                    card.href = `shop.html`; // کاربر عادی شوت میشه به شاپ برای خرید اشتراک!
                }

                card.className = 'movie-card vip-movie-card';

                card.innerHTML = `
            <div class="card-img-wrapper">
                <div class="vip-badge-tag"><i class="bi bi-crown-fill"></i> VIP</div>
                <img data-src="${movie.thumbnail}" alt="${movie.title}" class="lazy-img">
                <span class="card-duration">${movie.duration}</span>
            </div>
            <div class="card-info vip-card-info">
                <h4 class="card-title">${movie.title}</h4>
                <div class="card-meta">
                    <span style="color: #ffd700;"><i class="bi bi-eye-fill"></i> ${movie.views || 0} بازدید</span>
                </div>
            </div>
        `;
                grid.appendChild(card);
            });

            handleVipLazyLoading();
            renderPagination();
        }

        function handleVipLazyLoading() {
            const lazyImages = document.querySelectorAll('.lazy-img');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.getAttribute('data-src');
                            img.classList.add('loaded');
                            observer.unobserve(img);
                        }
                    });
                });
                lazyImages.forEach(img => observer.observe(img));
            } else {
                lazyImages.forEach(img => { img.src = img.getAttribute('data-src'); img.classList.add('loaded'); });
            }
        }

        function renderPagination() {
            const box = document.getElementById('paginationBox');
            if (!box) return;
            box.innerHTML = '';

            const totalPages = Math.ceil(filteredVipMovies.length / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${currentPage === i ? 'active' : ''}`;
                if (currentPage === i) {
                    btn.style = 'background:#ffd700; color:#000; border-color:#ffd700;';
                }
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderVipGrid();
                    window.scrollTo({ top: 350, behavior: 'smooth' });
                });
                box.appendChild(btn);
            }
        }

        function setupVipSearch() {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchBtn');
            if (!input || !btn) return;

            const search = () => {
                const txt = input.value.toLowerCase().trim();
                currentPage = 1;

                if (txt === '') {
                    filteredVipMovies = [...allVipMovies];
                } else {
                    filteredVipMovies = allVipMovies.filter(m =>
                        m.title?.toLowerCase().includes(txt) ||
                        m.description?.toLowerCase().includes(txt)
                    );
                }
                renderVipGrid();
            };

            btn.addEventListener('click', search);
            input.addEventListener('keyup', (e) => { if (e.key === 'Enter') search(); });
        }

        function setupScrollTop() {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) btn.style.display = 'block';
                else btn.style.display = 'none';
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        // =========================================================================
        // شنود زنده فرکانس آفتاب‌پرست (بچسبانید به آخر اسکریپت vip.html)
        // =========================================================================
        let activeSystemMode = 1; // تعریف متغیر به صورت عمومی برای استفاده در فیلتر بالا

        (async function () {
            try {
                const { doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                // به محض تغییر دکمه در ادمین، این مقدار زنده آپدیت می‌شود
                onSnapshot(doc(db, 'settings', 'networkConfig'), (configSnapshot) => {
                    if (configSnapshot.exists()) {
                        activeSystemMode = configSnapshot.data().currentMode || 1;

                        // شلیک به تابع اصلی فایربیس شما برای رندر مجدد و اعمال تغییرات بدون رفرش
                        if (typeof renderVipGrid === 'function' && typeof allVipMovies !== 'undefined') {
                            // یک‌بار فیلتر سراسری را با وضعیت جدید شبکه تحریک می‌کنیم
                            window.location.hash = window.location.hash ? "" : "#sync";
                        }
                    }
                });
            } catch (e) { console.log("خطا در همگام‌سازی فرکانس VIP:", e); }
        })();
    </script>
    <script type="module" src="js/menu.js"></script>
</body>

</html>
