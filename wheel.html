<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس ارواح | GHOST MOVIES</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-enhancer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --cyber-purple: #8b5cf6;
            --cyber-glow: #00ffcc;
            --cyber-dark: #0b0b0f;
            --card-bg: #12121a;
            --neon-pink: #ff0055;
        }

        body {
            background-color: var(--cyber-dark);
            color: #fff;
            padding-bottom: 60px;
        }

        /* هدر اختصاصی متصل به سیستم */
        .cyber-header {
            background: #0f111a;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            padding: 0 20px;
        }

        .menu-trigger {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--cyber-purple);
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .menu-trigger:hover {
            box-shadow: 0 0 10px var(--cyber-purple);
            color: var(--cyber-glow);
        }

        /* بخش اصلی گردونه */
        .wheel-container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            position: relative;
        }

        .wheel-area {
            position: relative;
            width: 360px;
            height: 360px;
            margin-bottom: 30px;
        }

        /* سوزن یا نشانگر بالای گردونه */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--cyber-glow);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--cyber-glow));
        }

        /* خودِ چرخ‌دنده با کانواس */
        #wheelCanvas {
            border-radius: 50%;
            border: 6px solid var(--cyber-purple);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.7);
            background: #101018;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* دکمه چرخش مرکزی */
        .spin-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: #1a1a26;
            border: 3px solid var(--cyber-glow);
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--cyber-glow);
            z-index: 5;
            transition: all 0.3s;
        }

        .spin-center-btn:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 0 25px var(--cyber-glow), inset 0 0 5px #fff;
        }

        .spin-center-btn:disabled {
            border-color: #4a5568;
            box-shadow: none;
            color: #718096;
            cursor: not-allowed;
        }

        /* باکس وضعیت و تایمرها */
        .status-panel {
            background: var(--card-bg);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .timer-display {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            margin-top: 10px;
            display: inline-block;
        }

        .stat-badge {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--cyber-purple);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <header class="cyber-header">
        <div class="header-wrap">
            <button class="menu-trigger" id="menuToggleBtn">
                <i class="bi bi-list"></i> <span>منو</span>
            </button>
            <div>
                <span
                    style="color: var(--cyber-glow); font-weight: bold; font-family: monospace; letter-spacing: 1px;">GHOST
                    WHEEL</span>
            </div>
        </div>
    </header>

    <main class="container" style="max-width: 800px; padding: 0 15px;">
        <div style="text-align: center; margin-top: 30px;">
            <h2 style="color: #fff; text-shadow: 0 0 10px var(--cyber-purple);"><i class="bi bi-gear-fill"></i> هسته
                شانس شبکه ارواح</h2>
            <p style="color: #a0aec0; font-size: 0.9rem; margin-top: 8px;">سیستم قرعه‌کشی روزانه هماهنگ با فرکانس کاربری
                شما. شانس خود را برای جوایز بزرگ آزمایش کنید!</p>
        </div>

        <div class="wheel-container-wrapper">
            <div class="wheel-area">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="350" height="350"></canvas>
                <button class="spin-center-btn" id="spinBtn">چرخاندن</button>
            </div>

            <div class="status-panel">
                <div id="userStatsRow">
                    <span class="stat-badge"><i class="bi bi-arrow-repeat"></i> کل گردش‌ها: <b
                            id="totalSpinsTxt">0</b></span>
                    <span class="stat-badge" style="color: var(--cyber-glow);"><i class="bi bi-lightning"></i> شانس
                        فعلی: <b id="luckLevelTxt">معمولی</b></span>
                </div>
                <div id="countdownBox" style="display: none; margin-top: 15px;">
                    <p style="font-size: 0.85rem; color: #a0aec0;">سیستم در حال خنک‌سازی هسته مغناطیسی (قفل موقت):</p>
                    <div class="timer-display" id="lockTimerTxt">00:00:00</div>
                </div>
                <p id="wheelNotice" style="color: #718096; font-size: 0.8rem; margin-top: 15px;"></p>
            </div>
        </div>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header">
            <span class="sidebar-title">منوی دسترسی</span>
            <button id="closeMenuBtn" class="close-menu-btn"><i class="bi bi-x-lg"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="bi bi-house-door"></i> خانه</a>
            <a href="series.html"><i class="bi bi-collection-play"></i> سریال‌ها</a>
            <a href="vip.html"><i class="bi bi-gem"></i> بخش VIP</a>
            <a href="shop.html"><i class="bi bi-bag-check"></i> خرید سرویس</a>
            <a href="wheel.html" class="active"><i class="bi bi-gear-fill"></i> گردونه شانس</a>
        </nav>
        <div class="sidebar-footer" id="userProfileSection"></div>
    </aside>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/menu.js"></script>

    <script type="module">
        import { db, auth } from './js/firebase.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // لیست دقیق تمام آیتم‌های گردونه
        const items = [
            { type: 'coin', value: 5, label: '5 سکه', color: '#1e1b4b' },
            { type: 'sub', value: 1, label: '1 روز VIP', color: '#311042' },
            { type: 'coin', value: 20, label: '20 سکه', color: '#1e1b4b' },
            { type: 'sub', value: 3, label: '3 روز VIP', color: '#311042' },
            { type: 'coin', value: 50, label: '50 سکه', color: '#2e1065' },
            { type: 'sub', value: 5, label: '5 روز VIP', color: '#4c1d95' },
            { type: 'sub', value: 2, label: '2 روز VIP', color: '#311042' },
            { type: 'sub', value: 7, label: '7 روز VIP', color: '#581c87' },
            { type: 'coin', value: 10, label: '10 سکه', color: '#1e1b4b' },
            { type: 'sub', value: 4, label: '4 روز VIP', color: '#311042' },
            { type: 'sub', value: 6, label: '6 روز VIP', color: '#4c1d95' }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');

        let isSubscriptionLocked = false;
        let currentLockEndTime = null;
        let countdownInterval = null;

        // 🎨 رسم گرافیک نئونی گردونه روی Canvas
        function drawWheel() {
            const numSegments = items.length;
            const anglePerSegment = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, i) => {
                const startAngle = i * anglePerSegment;
                const endAngle = startAngle + anglePerSegment;

                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 10, startAngle, endAngle);

                // افکت کمرنگ کردن آیتم‌های اشتراک در صورت برنده شدن اخیر (قفل ۵ روزه)
                if (item.type === 'sub' && isSubscriptionLocked) {
                    ctx.fillStyle = '#1a1a24'; // خاکستری ماتریکسی
                } else {
                    ctx.fillStyle = item.color;
                }
                ctx.fill();

                // خط کشی بین سگمنت‌ها
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
                ctx.stroke();

                // افزودن متن جوایز
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'right';
                ctx.verticalAlign = 'middle';

                if (item.type === 'sub' && isSubscriptionLocked) {
                    ctx.fillStyle = '#4a5568';
                } else {
                    ctx.fillStyle = item.type === 'sub' ? '#00ffcc' : '#ffd700';
                }

                ctx.font = 'bold 12px Sans-Serif';
                ctx.fillText(item.label, radius - 25, 5);
                ctx.restore();
            });
        }

        // 🧠 الگوریتم شانس وزنی متعادل شده و فوق‌العاده پویا
        function calculateSecurePrize(totalSpins) {
            let pool = [];

            // دریافت ایمیل کاربر فعلی برای باز کردن شانس‌های ادمین در حالت تست
            const currentUser = auth.currentUser;
            const isAdmin = currentUser && currentUser.email === 'aqayghost@gmail.com';

            items.forEach((item, index) => {
                let weight = 0;

                if (item.type === 'coin') {
                    if (item.value === 5) weight = 25;   // شانس منطقی برای برد کف
                    if (item.value === 10) weight = 20;  // شانس خوب برای ۱۰ سکه
                    if (item.value === 20) weight = 15;  // شانس متوسط برای ۲۰ سکه
                    // ۵۰ سکه برای ادمین همیشه بازه، برای کاربر عادی از گردش ۵ به بعد با شانس ۱۲٪
                    if (item.value === 50) {
                        weight = (totalSpins >= 5 || isAdmin) ? 12 : 0;
                    }
                } else if (item.type === 'sub') {
                    // بررسی اینکه اشتراک‌ها کلاً قفل نباشند
                    if (!isSubscriptionLocked) {
                        if (item.value === 1) weight = 10; // ۱ روزه
                        if (item.value === 2) weight = 8;  // ۲ روزه
                        if (item.value === 3) weight = 6;  // ۳ روزه

                        // اشتراک‌های بالاتر برای ادمین بازه، برای کاربر عادی از گردش ۵ به بعد
                        if (item.value === 4) weight = (totalSpins >= 5 || isAdmin) ? 5 : 0;
                        if (item.value === 5) weight = (totalSpins >= 5 || isAdmin) ? 4 : 0;
                        if (item.value === 6) weight = (totalSpins >= 5 || isAdmin) ? 3 : 0;
                        if (item.value === 7) weight = (totalSpins >= 5 || isAdmin) ? 2 : 0; // بمب ۷ روزه
                    }
                }

                // تزریق شانس‌ها به استخر ماتریکس
                for (let w = 0; w < weight; w++) {
                    pool.push(index);
                }
            });

            // اگر استخر خالی بود (مثلاً اشتراک قفل بود و بقیه موارد باگ خورد)، ۵ سکه به عنوان جایزه پایه
            if (pool.length === 0) return 0;

            // انتخاب کاملاً تصادفی اما بر اساس وزن‌های جدید
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // ⏱️ مدیریت سیستم تیک‌تاک تایمرهای ماتریکس
        function startCooldownClock(endTimeMs) {
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('countdownBox').style.display = 'block';
            spinBtn.disabled = true;

            const updateUI = () => {
                const now = new Date().getTime();
                const diff = endTimeMs - now;

                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdownBox').style.display = 'none';
                    spinBtn.disabled = false;
                    document.getElementById('wheelNotice').innerText = "هسته ریلود شد؛ دکمه چرخش آماده دریافت فرکانس است.";
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    const pad = (n) => String(n).padStart(2, '0');
                    document.getElementById('lockTimerTxt').innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
                }
            };
            updateUI();
            countdownInterval = setInterval(updateUI, 1000);
        }

        // 🔑 واکشی اطلاعات و پایش پایداری حساب کاربری در فایربیس
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                spinBtn.disabled = true;
                document.getElementById('wheelNotice').innerText = "خطای پروتکل: برای چرخاندن هسته ابتدا باید وارد حساب خود شوید.";
                return;
            }

            try {
                const userDocRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    const totalSpins = userData.totalSpins || 0;
                    const isAdmin = user.email === 'aqayghost@gmail.com';

                    document.getElementById('totalSpinsTxt').innerText = totalSpins;
                    if (totalSpins >= 5) {
                        document.getElementById('luckLevelTxt').innerText = "سطح پیشرفته ⚡ (جوایز بزرگ باز شدند)";
                        document.getElementById('luckLevelTxt').style.color = "var(--cyber-glow)";
                    }

                    // 1️⃣ بررسی وضعیت قفل ۵ روزه اشتراک‌ها (هم برای کاربر هم برای ادمین تا گرافیکش تست بشه)
                    if (userData.lastSubscriptionWin) {
                        const subWinDate = new Date(userData.lastSubscriptionWin);
                        const fiveDaysInMs = 5 * 24 * 60 * 60 * 1000;
                        if (new Date() - subWinDate < fiveDaysInMs) {
                            isSubscriptionLocked = true; // اشتراک‌ها کمرنگ خواهند شد
                        }
                    }

                    // ۲️⃣ رندر کردن چرخ‌دنده (حالا اگر اشتراک برده باشی، برای ادمین هم کمرنگ نشون داده میشه)
                    drawWheel();

                    // 3️⃣ مدیریت قفل تایمر دکمه چرخاندن
                    if (isAdmin) {
                        // اگر ادمین بودی، دکمه همیشه فعال بمونه و تایمر ۲۴ ساعته عمومی دور زده بشه
                        spinBtn.disabled = false;
                        document.getElementById('wheelNotice').innerText = "⚡ حالت ادمین فعال است. قفل دکمه برای شما باز است، اما افکت‌های گردونه فعالند.";
                        return;
                    }

                    // بررسی قفل ۲۴ ساعته عمومی (فقط برای کاربران عادی)
                    if (userData.lastCoinSpin) {
                        const lastSpinTime = new Date(userData.lastCoinSpin).getTime();
                        const nextAllowedSpin = lastSpinTime + (24 * 60 * 60 * 1000);

                        if (new Date().getTime() < nextAllowedSpin) {
                            startCooldownClock(nextAllowedSpin);
                            document.getElementById('wheelNotice').innerText = "سیستم به دلیل چرخش اخیر در وضعیت خنک‌سازی است.";
                            return;
                        }
                    }

                    spinBtn.disabled = false;
                    document.getElementById('wheelNotice').innerText = "آماده شلیک فرکانس شانس!";
                }
            } catch (err) {
                console.error("Error connecting to Lucky Grid Matrix:", err);
            }
        });

        // 🚀 اکشن دکمه اصلی: شلیک چرخ دنده و ثبت ایمن و فوق سریع جایزه
        spinBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            spinBtn.disabled = true;
            document.getElementById('wheelNotice').innerText = "در حال پردازش فرکانس شانس...";

            try {
                const userDocRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userDocRef);
                const userData = userSnap.data();

                const totalSpins = userData.totalSpins || 0;
                const targetIndex = calculateSecurePrize(totalSpins);
                const wonItem = items[targetIndex];

                // ⚡️ بهینه‌سازی سرعت سرور: محاسبات دیتابیس همین اول و قبل از انیمیشن انجام میشه
                const newTotalSpins = totalSpins + 1;
                let updatedCoins = userData.coins !== undefined ? userData.coins : 150;
                let currentAccess = userData.access || 'free';
                let currentVipExpire = userData.vipExpireAt ? new Date(userData.vipExpireAt) : new Date();

                let dbUpdates = {
                    totalSpins: newTotalSpins,
                    lastCoinSpin: new Date().toISOString()
                };

                if (wonItem.type === 'coin') {
                    updatedCoins += wonItem.value;
                    dbUpdates.coins = updatedCoins;
                } else if (wonItem.type === 'sub') {
                    dbUpdates.lastSubscriptionWin = new Date().toISOString();
                    dbUpdates.access = 'vip';

                    
                    let baseDate = new Date();
                    if (userData.access === 'vip' && userData.vipExpireAt) {
                        const existingExpire = new Date(userData.vipExpireAt);
                        if (existingExpire > baseDate) {
                            baseDate = existingExpire; 
                        }
                    }

                    baseDate.setDate(baseDate.getDate() + wonItem.value);
                    dbUpdates.vipExpireAt = baseDate.toISOString();
                }

                // 🛰️ ارسال موازی به سرور فایربیس (بدون اینکه منتظر پایان انیمیشن بمونه، آپدیت رو می‌فرسته)
                const firebasePromise = updateDoc(userDocRef, dbUpdates);

                // 🎡 شروع فوری انیمیشن فیزیکی فرانت بدون لِگ و معطلی
                const numSegments = items.length;
                const anglePerSegment = (2 * Math.PI) / numSegments;
                const segmentCenterAngle = (targetIndex * anglePerSegment) + (anglePerSegment / 2);

                let targetAngle = (1.5 * Math.PI) - segmentCenterAngle;
                if (targetAngle < 0) targetAngle += 2 * Math.PI;

                const extraSpinsAngle = 6 * 2 * Math.PI;
                const finalRotation = targetAngle + extraSpinsAngle;

                canvas.style.transform = `rotate(${finalRotation}rad)`;

                // انتظار برای ایستادن گردونه
                setTimeout(async () => {
                    // مطمئن می‌شیم که کانکشن فایربیس هم تا الان قطعاً تموم شده
                    await firebasePromise;

                    // 🎯 فراخوانی کادر آلرت اختصاصی و کادردار نئونی گست سیستم به جای alert پیش‌فرض
                    triggerCyberAlert(
                        "پروتکل شانس تایید شد",
                        `تبریک داداش! دیتاماین سیستم با موفقیت به پایان رسید. جایزه شما: [ ${wonItem.label} ] به حساب کاربری متصل شد.`,
                        true
                    );

                    // هدایت یا ریلود صفحه بعد از بستن آلرت (توسط کاربر یا اتوماتیک)
                    setTimeout(() => {
                        location.reload();
                    }, 5000);

                }, 4100);

            } catch (err) {
                console.error("Matrix Core Spin Interrupted:", err);
                spinBtn.disabled = false;
                document.getElementById('wheelNotice').innerText = "خطای اتصال؛ مجددا شانس خود را ارسال کنید.";
            }
        });

        // 📌 تابع جادویی ساخت کادر آلرت اختصاصی و نئونی کادردار در صفحه گردونه
        function triggerCyberAlert(title, message, isSuccess = false) {
            let alertOverlay = document.getElementById('customAlertOverlay');
            if (!alertOverlay) {
                alertOverlay = document.createElement('div');
                alertOverlay.id = 'customAlertOverlay';
                alertOverlay.innerHTML = `
                    <div class="custom-alert-card" style="background: #12121a; border: 2px solid #00ffcc; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); padding: 25px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; transform: scale(0.9); transition: all 0.3s; position: relative; overflow: hidden;">
                        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #8b5cf6, #00ffcc);"></div>
                        <div class="custom-alert-icon" style="font-size: 3rem; color: #00ffcc; margin-bottom: 15px; filter: drop-shadow(0 0 8px #00ffcc);">
                            <i class="bi bi-gift-fill"></i>
                        </div>
                        <h3 style="color: #fff; margin-bottom: 12px; font-size: 1.4rem; font-weight: bold; letter-spacing: 0.5px;">${title}</h3>
                        <p style="color: #a0aec0; font-size: 0.95rem; line-height: 1.7; margin-bottom: 22px; padding: 0 10px;">${message}</p>
                        <button id="customAlertCloseBtn" style="background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #fff; padding: 10px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);">دریافت جایزه و ریلود</button>
                    </div>
                `;

                Object.assign(alertOverlay.style, {
                    position: 'fixed',
                    top: '0',
                    left: '0',
                    width: '100vw',
                    height: '100vh',
                    backgroundColor: 'rgba(5, 5, 10, 0.85)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: '999999',
                    backdropFilter: 'blur(6px)',
                    transition: 'all 0.3s'
                });

                document.body.appendChild(alertOverlay);

                // انیمیشن کوچک باز شدن کادر
                setTimeout(() => {
                    alertOverlay.querySelector('.custom-alert-card').style.transform = 'scale(1)';
                }, 50);

                document.getElementById('customAlertCloseBtn').addEventListener('click', () => {
                    location.reload();
                });
            } else {
                alertOverlay.querySelector('h3').textContent = title;
                alertOverlay.querySelector('p').textContent = message;
                alertOverlay.style.display = 'flex';
            }
        }

        // رندر اولیه هنگام بالا آمدن صفحه
        drawWheel();
    </script>
</body>

</html>
